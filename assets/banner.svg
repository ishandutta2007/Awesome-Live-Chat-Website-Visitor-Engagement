<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radarPingGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style><![CDATA[
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #a5b4fc;
        letter-spacing: 1.5px;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #f1f5f9;
      }
    ]]></style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="600" cy="180" r="280" fill="url(#centerGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite" />
  </circle>

  <circle cx="140" cy="100" r="130" fill="#0284c7" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="260" r="150" fill="#ec4899" opacity="0.1">
    <animate attributeName="opacity" values="0.06;0.16;0.06" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== LEFT WING: REAL-TIME VISITOR RADAR ==================== -->
  <g transform="translate(40, 20)">
    <!-- Radar Base Frame -->
    <rect x="20" y="80" width="130" height="150" rx="16" fill="#131d31" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Concentric Target Rings -->
    <circle cx="85" cy="140" r="45" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="85" cy="140" r="30" fill="none" stroke="#38bdf8" stroke-dasharray="4 3" opacity="0.4" />
    <circle cx="85" cy="140" r="15" fill="none" stroke="#334155" stroke-width="1" />

    <!-- Expanding Radar Ping Waves (SMIL animation) -->
    <circle cx="85" cy="140" r="8" fill="url(#radarPingGrad)" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="r" values="8;50" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1.5;0.2" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="85" cy="140" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="r" values="8;50" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1.5;0.2" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
    </circle>

    <!-- Center Radar Core & Live Visitor Dots -->
    <circle cx="85" cy="140" r="4.5" fill="#38bdf8" />

    <!-- Active Visitors on Radar -->
    <circle cx="102" cy="128" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="70" cy="155" r="3.5" fill="#f59e0b">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="95" cy="162" r="3" fill="#ec4899">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.6s" repeatCount="indefinite" />
    </circle>

    <!-- Radar Tag Pill -->
    <rect x="35" y="200" width="100" height="22" rx="11" fill="#0c1322" stroke="#38bdf8" stroke-opacity="0.5" />
    <circle cx="48" cy="211" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="88" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7dd3fc">1.2k ONLINE</text>
  </g>

  <!-- ==================== RIGHT WING: LIVE CHAT & AI AGENTS ==================== -->
  <g transform="translate(1005, 55)">
    <!-- Chat Card 1: Visitor Query -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="155" height="58" rx="12" fill="#131d31" stroke="#334155" stroke-width="1.2" />
      <rect x="14" y="14" width="30" height="5" rx="2.5" fill="#38bdf8" />
      <rect x="14" y="26" width="115" height="5" rx="2.5" fill="#64748b" />
      <rect x="14" y="38" width="75" height="5" rx="2.5" fill="#475569" />
      <circle cx="138" cy="16" r="3.5" fill="#10b981" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="4s" repeatCount="indefinite" />
    </g>

    <!-- Chat Card 2: AI Bot Resolution -->
    <g filter="url(#cardShadow)">
      <rect x="15" y="72" width="155" height="64" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="32" cy="88" r="8" fill="#4f46e5" />
      <text x="32" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff">AI</text>
      <rect x="47" y="86" width="40" height="5" rx="2.5" fill="#a5b4fc" />
      <rect x="22" y="104" width="125" height="5" rx="2.5" fill="#818cf8" opacity="0.6" />
      <rect x="22" y="117" width="85" height="5" rx="2.5" fill="#818cf8" opacity="0.4" />
      <circle cx="152" cy="88" r="3.5" fill="#a855f7">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,3; 0,0" dur="4.5s" repeatCount="indefinite" />
    </g>

    <!-- Chat Card 3: Instant Lead Qualified -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="150" width="155" height="50" rx="12" fill="#131d31" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.2" />
      <circle cx="18" cy="175" r="5" fill="#10b981" />
      <rect x="32" y="166" width="60" height="5" rx="2.5" fill="#34d399" />
      <rect x="32" y="178" width="100" height="5" rx="2.5" fill="#64748b" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="3.5s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- ==================== FOREGROUND CONTENT: PROMINENT & CENTERED ==================== -->
  <!-- Top Category Pill -->
  <g transform="translate(600, 60)">
    <rect x="-165" y="0" width="330" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="0" y="19" text-anchor="middle" class="badge-text">
      &#x26A1; THE DEFINITIVE CURATED DIRECTORY &#x26A1;
    </text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="148" text-anchor="middle" class="title-text">
    Awesome Live Chat &amp; Visitor Engagement
  </text>

  <!-- Accent Divider -->
  <rect x="420" y="165" width="360" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text x="600" y="202" text-anchor="middle" class="subtitle-text">
    Top Enterprise SaaS Platforms &#x2022; Conversational AI Bots &#x2022; Self-Hosted Open-Source Alternatives
  </text>

  <!-- Core Focus Pills in Foreground -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Live Chat -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="145" height="36" rx="18" fill="#131d31" stroke="#38bdf8" stroke-width="1.2" />
      <text x="72" y="23" text-anchor="middle" class="pill-text">&#x1F4AC; Live Chat</text>
    </g>

    <!-- Pill 2: AI Copilots -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#131d31" stroke="#818cf8" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" class="pill-text">&#x1F916; AI Copilots</text>
    </g>

    <!-- Pill 3: Visitor Tracking -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#131d31" stroke="#c084fc" stroke-width="1.2" />
      <text x="82" y="23" text-anchor="middle" class="pill-text">&#x1F4E1; Visitor Radar</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="145" height="36" rx="18" fill="#131d31" stroke="#34d399" stroke-width="1.2" />
      <text x="72" y="23" text-anchor="middle" class="pill-text">&#x1F513; Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGrad)" rx="2" />
</svg>
